apiVersion: v1
kind: Pod
metadata:
  name: live-config-pod
spec:
  containers:
    - name: config-reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "message=$(cat /etc/live-config/message)"
            sleep 5
          done
      volumeMounts:
        - name: live-config
          mountPath: /etc/live-config
          readOnly: true
  volumes:
    - name: live-config
      configMap:
        name: live-config
