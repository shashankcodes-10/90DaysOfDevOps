apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
    - name: secret-demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "DB_USER=$DB_USER"
          echo "Secret files:"
          ls -l /etc/db-credentials
          sleep 3600
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
      volumeMounts:
        - name: db-credentials
          mountPath: /etc/db-credentials
          readOnly: true
  volumes:
    - name: db-credentials
      secret:
        secretName: db-credentials
